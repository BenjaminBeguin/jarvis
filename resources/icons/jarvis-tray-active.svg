<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Tray icon — active variant. Filled core ring signals "Jarvis is
    busy" (a task is running). Same template-image convention; macOS
    handles colour.
  -->
  <g fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round">
    <!-- Outer ring -->
    <circle cx="16" cy="16" r="11"/>
  </g>
  <!-- Filled inner ring + core: the "running" signal -->
  <circle cx="16" cy="16" r="6.5" fill="#000000"/>
</svg>
