<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Tray icon — pure-black template image. macOS recolours it
    automatically to match the menu bar (dark / light / accent).
    Read at 16×16 + 32×32 (@2x). Keep details legible at 16×16.
  -->
  <g fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round">
    <!-- Outer ring -->
    <circle cx="16" cy="16" r="11"/>
    <!-- Inner ring -->
    <circle cx="16" cy="16" r="6.5"/>
  </g>
  <!-- Solid core dot -->
  <circle cx="16" cy="16" r="2.5" fill="#000000"/>
</svg>
