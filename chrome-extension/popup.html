<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Jarvis</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      width: 320px;
      padding: 16px;
      font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace;
      background: #04070b;
      color: #d8eefb;
      font-size: 12px;
      line-height: 1.55;
    }
    h1 {
      margin: 0 0 14px;
      font-size: 12px;
      letter-spacing: 0.32em;
      color: #00d4ff;
      text-shadow: 0 0 8px rgba(0, 212, 255, 0.55);
    }
    p { margin: 0 0 12px; color: #88a7bd; }
    label {
      display: block;
      margin: 0 0 12px;
      color: #5d7c91;
      font-size: 10.5px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    input {
      display: block;
      width: 100%;
      margin-top: 6px;
      box-sizing: border-box;
      padding: 8px 10px;
      font: inherit;
      font-size: 11.5px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(0, 217, 255, 0.2);
      color: #d8eefb;
      border-radius: 3px;
      outline: none;
      letter-spacing: 0.02em;
    }
    input:focus { border-color: #00d4ff; }
    .row { display: flex; gap: 8px; }
    button {
      flex: 1;
      padding: 9px 12px;
      font: inherit;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      background: transparent;
      border: 1px solid rgba(0, 217, 255, 0.4);
      color: #00d4ff;
      border-radius: 3px;
      cursor: pointer;
      transition: background 140ms ease, box-shadow 140ms ease;
    }
    button:hover {
      background: rgba(0, 212, 255, 0.08);
      box-shadow: 0 0 8px rgba(0, 212, 255, 0.35);
    }
    button.secondary {
      border-color: rgba(255, 255, 255, 0.18);
      color: #88a7bd;
    }
    button.secondary:hover {
      background: rgba(255, 255, 255, 0.04);
      box-shadow: none;
    }
    .status {
      margin-top: 12px;
      padding: 8px 10px;
      border-radius: 3px;
      font-size: 11px;
    }
    .status--ok { background: rgba(95, 255, 166, 0.08); color: #5fffa6; }
    .status--bad { background: rgba(255, 85, 119, 0.08); color: #ff8585; }
    .status--info { background: rgba(0, 212, 255, 0.06); color: #88a7bd; }
    .hint { margin-top: 14px; color: #5d7c91; font-size: 10.5px; }
    .hint code {
      background: rgba(255, 255, 255, 0.06);
      padding: 1px 5px;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <h1>◢ JARVIS</h1>
  <p>Ping Jarvis when you join a Meet / Zoom / Teams / Whereby call.</p>

  <label>
    Jarvis URL
    <input id="baseUrl" type="text" placeholder="http://127.0.0.1:4747" autocomplete="off" spellcheck="false" />
  </label>
  <label>
    Bearer token
    <input id="token" type="password" placeholder="from Settings → API" autocomplete="off" spellcheck="false" />
  </label>

  <div class="row">
    <button id="save">Save</button>
    <button id="test" class="secondary">Test</button>
  </div>

  <div id="status" class="status status--info" hidden></div>

  <p class="hint">
    Find both in the desktop app under <code>Settings → API</code>. Localhost
    works when you're on the same Mac; for Tailscale, paste your
    <code>&lt;mac&gt;.&lt;tail-net&gt;.ts.net:4747</code> URL.
  </p>

  <script src="popup.js"></script>
</body>
</html>
