appId: app.jarvis
productName: Jarvis
asar: true
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Jarvis uses the microphone for voice commands.
    # LSUIElement: true would hide the app from the Dock + Cmd+Tab.
    # We surface it as a real app so the user can alt-tab to it and see it
    # in their window manager. The tray icon stays as the always-on entry.
    LSUIElement: false
dmg:
  sign: false
publish: null
