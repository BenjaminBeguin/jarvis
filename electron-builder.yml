appId: app.jarvis
productName: Jarvis
asar: true
asarUnpack:
  # ffmpeg-static ships a precompiled binary that needs to be executable
  # at runtime. Files inside app.asar can't be exec'd, so unpack it.
  # Used by the Telegram bot module to decode voice-note OGG/Opus.
  - "**/node_modules/ffmpeg-static/**"
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
  # PNG tray icons + app-icon PNG fallback. Runtime code in
  # tray.ts and windows.ts resolves these via
  # `../../resources/icons/<name>.png` — keeping the relative path
  # working in both dev (real fs) and prod (asar fs) saves us from
  # having to plumb an alternate path resolver. Excludes SVG sources,
  # those are only needed at build time by `scripts/build-icons.mjs`.
  - resources/icons/*.png
  - resources/icons/*.icns
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.productivity
  # Generated by `pnpm build:icons` from resources/icons/jarvis-app.svg.
  # Keep it under resources/icons/ so the SVG sources + PNG fallbacks
  # all live together.
  icon: resources/icons/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Jarvis uses the microphone for voice commands.
    # LSUIElement: true would hide the app from the Dock + Cmd+Tab.
    # We surface it as a real app so the user can alt-tab to it and see it
    # in their window manager. The tray icon stays as the always-on entry.
    LSUIElement: false
dmg:
  sign: false
publish: null
